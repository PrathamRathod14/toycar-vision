# Copy this file to config.yaml and adjust it for the actual camera and field.
camera:
  source: 0                 # camera index, video path, or RTSP/HTTP URL
  width: 1280
  height: 720
  fps: 60
  buffer_size: 1
  calibration_file: null   # e.g. calibration/camera.yaml

aruco:
  dictionary: DICT_4X4_50
  min_quality: 0.45
  corner_refinement: SUBPIX

field:
  size_mm: [2500.0, 1500.0]
  # Option A: a fixed homography generated by tools/capture_homography.py.
  homography_file: null     # e.g. calibration/homography.yaml
  # Option B: estimate the homography from four fixed tags on the floor.
  # Replace these examples with the measured world coordinates of tag CENTERS.
  auto_homography:
    enabled: true
    marker_world_centers:
      0: [0.0, 0.0]
      1: [2500.0, 0.0]
      2: [2500.0, 1500.0]
      3: [0.0, 1500.0]

cars:
  - marker_id: 10
    name: Red Racer
    # Degrees added to the tag's direction (center toward its printed top edge).
    heading_offset_deg: 0.0
  - marker_id: 11
    name: Green Hornet
    heading_offset_deg: 0.0

tracking:
  position_time_constant_s: 0.010
  velocity_time_constant_s: 0.080
  max_gap_s: 0.25
  max_speed_mm_s: 10000.0

network:
  host: 127.0.0.1
  port: 5000
  emit_missing: true

display:
  enabled: true
  scale: 1.0

